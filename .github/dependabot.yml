version: 2
updates:
  # Monitoramento de dependências do npm (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # Preserva o invariante de runtime: Zod v3 (^3.24.x) para compatibilidade com @hookform/resolvers/zod
      - dependency-name: "zod"
        versions: [">= 4.0.0"]
        update-types: ["version-update:semver-major"]
      # Preserva o invariante de runtime: Node.js 24 LTS (.nvmrc e CI)
      - dependency-name: "@types/node"
        versions: [">= 25.0.0"]
        update-types: ["version-update:semver-major"]
      # Preserva estabilidade dos linters e tooling durante a Fase 2 (compatibilidade com Next.js 16)
      - dependency-name: "eslint"
        versions: [">= 10.0.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        versions: [">= 6.0.0"]
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        versions: [">= 4.0.0"]
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # Monitoramento de versões das GitHub Actions (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
