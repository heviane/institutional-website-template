name: CI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (Strict)
        run: npm ci

      - name: Run Documentation Audit (Strict Quality Gate)
        run: npm run audit:docs

      - name: Run ESLint (Strict Quality Gate)
        run: npm run lint

      - name: Run TypeScript typecheck (Strict Quality Gate)
        run: npm run typecheck

      - name: Run Tests (Vitest & axe-core - Strict Quality Gate)
        run: npm test

      - name: Build Next.js (Strict Quality Gate)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_ENABLE_TURNSTILE: "false"
          RESEND_API_KEY: "mock_resend_key_for_ci"
          RESEND_FROM_EMAIL: "Contato <contato@empresa.com.br>"
          CONTACT_EMAIL_TO: "contato@empresa.com.br"
          RATE_LIMIT_SECRET: "ci-mock-rate-limit-secret-16chars-minimum"
